<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student List</title>

    <!-- Bootstrap -->
     <link rel="stylesheet" href="/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <h1>Students List</h1>
    <a href="/add">Add Student</a>

    <table border="1">
        <thead>
            <tr><th>Name</th><th>Email</th><th>Course</th><th>Action</th></tr>
        </thead>
        <tbody id="data"></tbody>
    </table>

<script>
fetch("/data")
.then(res => res.json())
.then(data => {
    let rows = "";
    data.forEach(s => {
        rows += `
        <tr>
            <td>${s.name}</td>
            <td>${s.email}</td>
            <td>${s.course}</td>
            <td>
                <a href="/edit/${s.id}">Edit</a>
                <a href="/delete/${s.id}">Delete</a>
            </td>
        </tr>`;
    });
    document.getElementById("data").innerHTML = rows;
});
</script>
</body>
</html>
